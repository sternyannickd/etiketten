# Konfiguration des Etikettendrucks.
# Alle Maße in Millimetern. Relative Pfade gelten relativ zu dieser Datei.

produkte = "data/produkte.json"
# true = Kaffees und Versionen lassen sich in der Oberfläche anlegen und ändern.
# false im Notbetrieb, wenn die Liste vom Server kommt und lokal nicht abweichen soll.
produkte_bearbeiten = true
protokoll = "var/druckprotokoll.csv"   # leer ("") = kein Protokoll

[server]
host = "127.0.0.1"   # "0.0.0.0" = auch von anderen Geräten im Netz erreichbar
port = 8077
# Bei host = "0.0.0.0" oder hinter tosto: Rechner- bzw. Portalnamen, unter denen
# die Seite im Browser aufgerufen wird (sonst lehnt der Server Anfragen ab, 403).
# IP-Adressen, localhost und der eigene Rechnername (auch kurz und mit .local)
# sind immer erlaubt.
# erlaubte_namen = ["etiketten.fritz.box"]

[drucker]
name = "Citizen CL-S521"
dpi = 203

# Wie die ZPL-Daten zum Drucker kommen:
#   "usb"  – direkt auf /dev/usb/lp*, ohne CUPS (Standard)
#   "cups" – über eine CUPS-Warteschlange im Raw-Modus (lp -o raw)
#   "tcp"  – an einen Netzwerkdrucker (Port 9100)
#   "datei" – nichts drucken, ZPL nur nach var/ausgabe/ schreiben (Trockenlauf)
transport = "usb"

# usb: Gerätedatei. "auto" sucht das USB-Gerät, dessen Kennung usb_kennung enthält.
usb_geraet = "auto"
usb_kennung = "CITIZEN"

# cups: Name der Warteschlange (lpstat -v)
cups_warteschlange = "Citizen_CL_S521_raw"

# tcp: Adresse des Netzwerkdruckers
tcp_host = "192.168.1.50"
tcp_port = 9100

# Zeichensatz für Umlaute: "utf8" (^CI28) oder "latin1" (^CI27, Windows-1252).
# Falls der Testdruck statt Umlauten Unsinn zeigt: den anderen probieren.
zeichensatz = "utf8"

# Optional, leer lassen = Einstellung am Drucker gilt.
# schwaerzung: -30 … 30 (^MD), geschwindigkeit: 2 … 6 Zoll/s (^PR)
# schwaerzung = 0
# geschwindigkeit = 4

[vorschau]
# Vorschau über den Online-Dienst labelary.com. Optional: Drucken
# funktioniert auch ohne, wenn der Dienst nicht erreichbar ist.
aktiv = true
url = "https://api.labelary.com/v1/printers/{dpmm}dpmm/labels/{breite_zoll}x{hoehe_zoll}/0/"
timeout_s = 5

[etikett]
breite = 57
hoehe = 32
# Kalibrierung: verschiebt den gesamten Inhalt (positiv = nach rechts/unten).
versatz_x = 0.0
versatz_y = 0.0

[layout.titel]
x = 2.0
y = 2.0
breite = 40.0
hoehe = 9.0
max_zeilen = 2
schrift_max = 5.0      # Zeichenhöhe in mm bei kurzen Namen
schrift_min = 3.0      # kleiner wird nicht; der Name wird dann gekürzt

[layout.barcode]
x = 2.0                # linke Kante inkl. der ersten Ziffer
y = 12.0
modul = 3              # Breite eines Strichs in Druckpunkten (203 dpi: 3 = 0,375 mm)
balkenhoehe = 14.0

[layout.mhd]
x = 46.5               # linke Kante der senkrechten MHD-Spalte
y = 2.0
laenge = 28.0          # verfügbare Länge entlang der Etikettenhöhe
einzeilig = true        # false = "MHD:" klein und das Datum groß darunter (zwei Spalten)
beschriftung = "MHD:"
beschriftung_schrift = 2.6
datum_schrift = 4.6
datumsformat = "%d.%m.%Y"

# --- Verpackungsetikett (zweite Etikettenart, Oberfläche /verpackung) ----------
# Name, Info (pro Kaffee im Reiter Produkte), Röstdatum, Charge, MHD und QR-Code.
[verpackung]
aktiv = true
protokoll = "var/verpackungsprotokoll.csv"
qr_adresse = "https://stern-kaffee.de"       # wohin der QR-Code führt
qr_text = ""                                  # Text unter dem QR-Code, leer = Adresse ohne https://
# Gestaltung, wenn in der Oberfläche nichts gewählt ist: "schlicht", "klassisch"
# (Rahmen, Stern) oder "banner" (schwarzes Band). Entwürfe: docs/entwuerfe/
stil = "schlicht"
kopfzeile = "Stern Rösterei Wissmüller"       # oben bei klassisch/banner, leer = keine

# Drucker: alles aus [drucker] gilt, außer was hier steht. Hängt der Drucker für
# die Verpackung an einem anderen Rechner, dort in config.lokal.toml einstellen.
[verpackung.drucker]
name = "Citizen CL-S521 (Verpackung)"
# usb_geraet = "/dev/usb/lp0"

# Zurzeit die Versandetiketten-Rolle (100 mm breit, 150 mm lang).
[verpackung.etikett]
breite = 100
hoehe = 150
versatz_x = 0.0
versatz_y = 0.0

[verpackung.layout.titel]
x = 6.0
y = 7.0
breite = 88.0
hoehe = 26.0
max_zeilen = 2
schrift_max = 10.0
schrift_min = 6.0

[verpackung.layout.linie_oben]
y = 36.0
staerke = 0.5

[verpackung.layout.info]
x = 6.0
y = 41.0
breite = 88.0
hoehe = 50.0
schrift = 3.4                 # Fließtext
ueberschrift_schrift = 4.6    # Zeilen, die mit "#" beginnen

[verpackung.layout.linie_unten]
y = 96.0
staerke = 0.5

[verpackung.layout.daten]       # Röstdatum, Charge, MHD untereinander
x = 6.0
y = 102.0
abstand = 15.0
beschriftung_schrift = 3.0
wert_schrift = 5.5
datumsformat = "%d.%m.%Y"

[verpackung.layout.qr]          # quadratisches Feld; der Code wird so groß wie möglich
x = 58.0
y = 101.0
groesse = 36.0
text_schrift = 2.6
