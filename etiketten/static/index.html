<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etikettendruck</title>
  <style>
    body { margin: 0; padding: 16px; background: #f4f1ec; }
    @media (max-width: 800px) { body { padding: 12px; } }
  </style>
  <script type="module" src="/static/etiketten-app.js"></script>
</head>
<body>
  <etiketten-app api="/api"></etiketten-app>
  <script type="module">
    // Direktlink auf ein Produkt, z. B. http://localhost:8077/?produkt=kolumbien
    const produkt = new URLSearchParams(location.search).get("produkt");
    if (produkt) document.querySelector("etiketten-app").setAttribute("produkt", produkt);
  </script>
</body>
</html>
