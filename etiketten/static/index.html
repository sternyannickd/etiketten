<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etikettendruck</title>
  <style>
    body { margin: 0; padding: 16px; background: #f4f1ec; }
    @media (max-width: 800px) { body { padding: 12px; } }
  </style>
  <script type="module" src="/static/etiketten-app.js"></script>
</head>
<body>
  <etiketten-app api="/api"></etiketten-app>
  <script type="module">
    // Direktlink, z. B. http://localhost:8077/?kaffee=kolumbien&version=edeka
    // (?produkt= aus Version 0.2 funktioniert weiter)
    const q = new URLSearchParams(location.search);
    const app = document.querySelector("etiketten-app");
    const kaffee = q.get("kaffee") || q.get("produkt");
    if (kaffee) app.setAttribute("kaffee", kaffee);
    if (q.get("version")) app.setAttribute("version", q.get("version"));
  </script>
</body>
</html>
